# 미리보기 배포: 지금 작업 중인 사이트를 GitHub Pages(https://wickedstormkr.github.io/wickedstorm-homepage/)에 올린다.
# 저장소 설정 → Pages → Source를 'GitHub Actions'로 두어야 한다.
# 기본 브랜치가 아닌 브랜치에서 올리려면 설정 → Environments → github-pages → Deployment branches에 그 브랜치를 더한다.
name: 미리보기 배포

on:
  push:
    branches: [main, phase-3/pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: 빌드(GitHub Pages 경로)
    runs-on: ubuntu-24.04
    env:
      SITE_URL: https://wickedstormkr.github.io
      BASE_PATH: /wickedstorm-homepage/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # 미리보기는 검색에 걸리지 않게
      - run: printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    name: 배포
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
